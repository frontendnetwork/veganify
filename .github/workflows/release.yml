# Release pipeline: semantic-release → Docker image → k8s rollout.
#
# - staging: cuts rc prereleases (v4.0.0-rc.1, …) and publishes the
#   version-tagged Docker image. No deployment.
# - main: cuts stable releases (v4.0.0, …), publishes the version-tagged
#   image (+latest) and rolls it out to the production cluster.

name: Release

on:
  push:
    branches:
      - main
      - staging

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PROD_NAMESPACE: veganify
  PROD_DEPLOYMENT: veganify-frontend

jobs:
  semrel:
    name: semantic-release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.semrel.outputs.new_release_published }}
      version: ${{ steps.semrel.outputs.new_release_version }}
      git_tag: ${{ steps.semrel.outputs.new_release_git_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run semantic-release
        id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx semantic-release

  docker:
    name: Build and push image
    needs: semrel
    if: needs.semrel.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          VERSION: ${{ needs.semrel.outputs.version }}
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          TAGS="${IMAGE}:v${VERSION}"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_STAGING=${{ github.ref_name == 'staging' && 'true' || 'false' }}
          tags: ${{ steps.tags.outputs.tags }}

  deploy-prod:
    name: Roll out to production
    needs: [semrel, docker]
    if: needs.semrel.outputs.released == 'true' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://veganify.app
    steps:
      - name: Set up Kubectl
        uses: azure/setup-kubectl@v5.1.0
        with:
          version: "latest"

      - name: Configure Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 --decode > $HOME/.kube/config

      - name: Pin deployment image to release tag
        env:
          VERSION: ${{ needs.semrel.outputs.version }}
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}:v${VERSION}"
          CONTAINER=$(kubectl get deployment "$PROD_DEPLOYMENT" -n "$PROD_NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].name}')
          kubectl set image deployment/"$PROD_DEPLOYMENT" -n "$PROD_NAMESPACE" \
            "$CONTAINER=$IMAGE"
          kubectl rollout status deployment/"$PROD_DEPLOYMENT" -n "$PROD_NAMESPACE" \
            --timeout=180s
